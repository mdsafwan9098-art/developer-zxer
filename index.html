
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e1c">
<title>Developer ZXER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1c;color:#eef5ff;font-family:Arial,sans-serif;padding-bottom:100px}
header{padding:20px;background:#101c33;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:900;color:#38aaff}
button{border:0;border-radius:12px;padding:12px;background:#168cff;color:white;font-weight:bold}
input{width:100%;padding:14px;margin:7px 0;background:#101c33;color:white;border:1px solid #294568;border-radius:10px}
section{padding:16px}
.card{background:#111e35;border:1px solid #203b60;border-radius:18px;padding:14px;margin:12px 0}
.product{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product .card{margin:0}
.product img{width:100%;height:120px;object-fit:cover;border-radius:12px}
.price{color:#45b6ff;font-size:19px;font-weight:bold}
nav{position:fixed;bottom:12px;left:12px;right:12px;background:#142744;border:1px solid #31547c;border-radius:35px;padding:12px;display:flex;justify-content:space-around;box-shadow:0 5px 25px #000}
nav button{background:transparent;padding:9px;font-size:12px}
.hidden{display:none}
h2{color:#58baff}
</style>
</head>
<body>
<header>
<div class="logo">DEVELOPER ZXER</div>
<div id="walletTop">৳0.00</div>
</header>

<section id="auth">
<div class="card">
<h2>Welcome Back</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>
<button onclick="forgot()">Forgot Password?</button>
<p id="authMsg"></p>
</div>
</section>

<section id="home" class="hidden">
<div class="card">
<h2 id="homeTitle">Premium Digital Store</h2>
<p id="homeSubtitle">Welcome to Developer ZXER</p>
<p id="notice"></p>
</div>
<h2>Products</h2>
<div id="products" class="product"></div>
</section>

<section id="fund" class="hidden">
<div class="card">
<h2>Add Fund</h2>
<p>Choose payment method and send money.</p>
<select id="fundMethod">
<option value="bKash">bKash</option>
<option value="Nagad">Nagad</option>
</select>
<p id="fundNumber"></p>
<input id="fundAmount" type="number" placeholder="Amount">
<input id="fundTrx" placeholder="Transaction ID">
<button onclick="requestFund()">Submit Fund Request</button>
<hr>
<h2>Referral Code</h2>
<input id="refCode" placeholder="Enter Referral Code">
<button onclick="submitReferral()">Submit Code</button>
<p id="refMsg"></p>
</div>
</section>

<section id="profile" class="hidden">
<div class="card">
<h2>My Profile</h2>
<input id="displayName" placeholder="Your Name">
<input id="avatar" type="text" placeholder="Avatar emoji (e.g. 🚀)">
<button onclick="saveProfile()">Save Profile</button>
<button onclick="logout()">Logout</button>
</div>
</section>

<section id="orders" class="hidden">
<h2>My Orders</h2>
<div id="orderList"></div>
</section>

<nav>
<button onclick="page('home')">⌂<br>Home</button>
<button onclick="page('fund')">＋<br>Add Fund</button>
<button onclick="page('orders')">▣<br>Orders</button>
<button onclick="page('profile')">●<br>Profile</button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getDatabase,ref,get,set,push,update} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyCY7gl6V_WANX6B_irbNdap8z7pZfSb5Os",
authDomain:"devzxer-9d8e9.firebaseapp.com",
databaseURL:"https://devzxer-9d8e9-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"devzxer-9d8e9",
storageBucket:"devzxer-9d8e9.firebasestorage.app",
messagingSenderId:"101740085617",
appId:"1:101740085617:web:86d08757e668d4b897b6d0"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
let user=null,productsData={};

window.login=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value)}catch(e){authMsg.textContent=e.message}};
window.signup=async()=>{try{await createUserWithEmailAndPassword(auth,email.value,password.value)}catch(e){authMsg.textContent=e.message}};
window.forgot=async()=>{try{await sendPasswordResetEmail(auth,email.value);authMsg.textContent="Reset email sent"}catch(e){authMsg.textContent=e.message}};
window.logout=()=>signOut(auth);
window.page=(p)=>{["home","fund","profile","orders"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==p))};

onAuthStateChanged(auth,async u=>{
user=u;
auth.classList.toggle("hidden",!!u);
home.classList.toggle("hidden",!u);
if(!u)return;
await set(ref(db,"users/"+u.uid+"/email"),u.email);
loadData();
});

async function loadData(){
let [p,w,s,o]=await Promise.all([
get(ref(db,"products")),get(ref(db,"wallets/"+user.uid)),
get(ref(db,"settings")),get(ref(db,"orders/"+user.uid))
]);
productsData=p.val()||{};
walletTop.textContent="৳"+((w.val()||{}).balance||0);
let settings=s.val()||{};
homeTitle.textContent=settings.home?.title||"Developer ZXER";
homeSubtitle.textContent=settings.home?.subtitle||"Premium Digital Store";
notice.textContent=settings.notice||"";
fundNumber.textContent="bKash: 01747737267 | Nagad: 01718316646";
products.innerHTML="";
Object.entries(productsData).forEach(([id,p])=>{
if(p.active===false)return;
let d=document.createElement("div");d.className="card";
let img=document.createElement("img");img.src=p.imageData||"";
let name=document.createElement("h3");name.textContent=p.name||"Product";
let price=document.createElement("div");price.className="price";price.textContent="৳"+(p.price||0);
let buy=document.createElement("button");buy.textContent="Buy Now";buy.onclick=()=>buyProduct(id,p);
d.append(img,name,price,buy);products.append(d);
});
let orders=o.val()||{};orderList.innerHTML="";
Object.entries(orders).forEach(([id,o])=>{
let d=document.createElement("div");d.className="card";
d.textContent=(o.productName||"Product")+" — "+(o.status||"pending");
if(o.status==="approved"&&o.downloadUrl){
let a=document.createElement("a");a.href=o.downloadUrl;a.textContent="Download";a.target="_blank";d.append(a);
}
orderList.append(d);
});
}

async function buyProduct(id,p){
let method=prompt("Type WALLET or INSTANT");
if(!method)return;
if(method.toUpperCase()==="WALLET"){
alert("Wallet payment requires secure server-side transaction processing. It is not enabled in this client-only version.");
return;
}
let m=prompt("Payment method: bKash or Nagad");
let trx=prompt("Enter Transaction ID");
if(!m||!trx)return;
await push(ref(db,"orders/"+user.uid),{
productId:id,productName:p.name,price:Number(p.price)||0,
paymentMethod:m,trxId:trx,status:"pending",
downloadUrl:p.downloadUrl||"",createdAt:Date.now()
});
alert("Order submitted for admin approval.");
loadData();
}

window.requestFund=async()=>{
let amount=Number(fundAmount.value),trx=fundTrx.value.trim();
if(amount<=0||!trx)return alert("Enter valid amount and transaction ID");
await push(ref(db,"walletRequests/"+user.uid),{
amount,method:fundMethod.value,trxId:trx,status:"pending",requestedAt:Date.now()
});
alert("Fund request submitted.");
};

window.submitReferral=async()=>{
alert("Referral rewards require a secure one-time claim process. It is not enabled in this client-only version.");
};
window.saveProfile=async()=>{
await update(ref(db,"users/"+user.uid),{
displayName:displayName.value,avatar:avatar.value
});alert("Profile saved");
};
</script>
</body>
</html>
