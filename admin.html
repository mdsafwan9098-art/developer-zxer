
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer ZXER Admin</title>
<style>
body{margin:0;background:#080e1c;color:white;font-family:Arial;padding:18px}
h1,h2{color:#45b4ff}
.card{background:#111e35;border:1px solid #294568;border-radius:16px;padding:16px;margin:14px 0}
input,textarea{width:100%;padding:12px;margin:7px 0;background:#080e1c;color:white;border:1px solid #345477;border-radius:9px;box-sizing:border-box}
button{background:#168cff;color:white;border:0;padding:12px;border-radius:10px;margin:4px}
img{max-width:100%;max-height:150px;object-fit:contain}
.hidden{display:none}
</style>
</head>
<body>
<h1>DEVELOPER ZXER</h1>
<div id="login" class="card">
<h2>Admin Login</h2>
<input id="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="loginAdmin()">Login</button>
<p id="msg"></p>
</div>

<main id="panel" class="hidden">
<div class="card">
<h2>Add / Edit Product</h2>
<input id="pid" placeholder="Product ID (blank for new)">
<input id="name" placeholder="Product Name">
<textarea id="description" placeholder="Description"></textarea>
<input id="price" type="number" placeholder="Price">
<input id="category" placeholder="Category">
<label>Product Image Upload</label>
<input id="imageFile" type="file" accept="image/*">
<img id="preview">
<input id="downloadUrl" placeholder="Download URL">
<input id="videoUrl" placeholder="Setup Video URL">
<label><input id="active" type="checkbox" checked> Active</label>
<button onclick="saveProduct()">Save Product</button>
</div>

<div class="card">
<h2>Products</h2><div id="productList"></div>
</div>

<div class="card">
<h2>Wallet Requests</h2><div id="fundList"></div>
</div>

<div class="card">
<h2>Product Orders</h2><div id="orderList"></div>
</div>

<div class="card">
<h2>Create Custom Referral</h2>
<input id="refText" placeholder="Your Referral Code">
<input id="refAmount" type="number" placeholder="Reward Amount">
<input id="refLimit" type="number" value="3" min="1" max="3">
<button onclick="createReferral()">Create Referral</button>
<div id="refList"></div>
</div>

<div class="card">
<h2>Home Settings</h2>
<input id="homeTitle" placeholder="Home Title">
<input id="homeSubtitle" placeholder="Subtitle">
<textarea id="notice" placeholder="Notice"></textarea>
<button onclick="saveSettings()">Save Settings</button>
</div>
<button onclick="logoutAdmin()">Logout</button>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import{getDatabase,ref,get,set,push,update,remove}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

const config={
apiKey:"AIzaSyCY7gl6V_WANX6B_irbNdap8z7pZfSb5Os",
authDomain:"devzxer-9d8e9.firebaseapp.com",
databaseURL:"https://devzxer-9d8e9-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"devzxer-9d8e9",
storageBucket:"devzxer-9d8e9.firebasestorage.app",
messagingSenderId:"101740085617",
appId:"1:101740085617:web:86d08757e668d4b897b6d0"
};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app);
let admin=false,imageData="";

window.loginAdmin=async()=>{
try{await signInWithEmailAndPassword(auth,email.value,password.value)}
catch(e){msg.textContent=e.message}
};
onAuthStateChanged(auth,async u=>{
if(!u)return;
let a=await get(ref(db,"admins/"+u.uid));
if(a.val()!==true){msg.textContent="Access denied";await signOut(auth);return}
admin=true;login.classList.add("hidden");panel.classList.remove("hidden");load();
});
window.logoutAdmin=()=>signOut(auth);

imageFile.onchange=()=>{
let f=imageFile.files[0];if(!f)return;
if(f.size>300000) return alert("Image must be under 300 KB");
let r=new FileReader();r.onload=()=>{imageData=r.result;preview.src=imageData};r.readAsDataURL(f);
};

window.saveProduct=async()=>{
if(!admin)return;
let id=pid.value.trim()||push(ref(db,"products")).key;
let old=await get(ref(db,"products/"+id));
await set(ref(db,"products/"+id),{
name:name.value,description:description.value,
price:Number(price.value)||0,category:category.value,
imageData:imageData||old.val()?.imageData||"",
downloadUrl:downloadUrl.value.trim(),setupVideoUrl:videoUrl.value.trim(),
active:active.checked,updatedAt:Date.now()
});
alert("Product saved");load();
};

async function load(){
let p=(await get(ref(db,"products"))).val()||{};
productList.innerHTML="";
Object.entries(p).forEach(([id,x])=>{
let d=document.createElement("div");d.className="card";
d.textContent=x.name+" — ৳"+x.price;
let edit=document.createElement("button");edit.textContent="Edit";edit.onclick=()=>{
pid.value=id;name.value=x.name;description.value=x.description;
price.value=x.price;category.value=x.category;
downloadUrl.value=x.downloadUrl;videoUrl.value=x.setupVideoUrl;
active.checked=x.active;imageData=x.imageData||"";preview.src=imageData;
};
let del=document.createElement("button");del.textContent="Delete";del.onclick=async()=>{
if(confirm("Delete product?")){await remove(ref(db,"products/"+id));load()}
};
d.append(edit,del);productList.append(d);
});

let w=(await get(ref(db,"walletRequests"))).val()||{};
fundList.innerHTML="";
Object.entries(w).forEach(([uid,items])=>Object.entries(items||{}).forEach(([id,x])=>{
let d=document.createElement("div");d.className="card";
d.textContent=uid+" | ৳"+x.amount+" | "+x.method+" | "+x.trxId+" | "+x.status;
let ok=document.createElement("button");ok.textContent="Approve";
ok.onclick=()=>alert("Wallet credit requires a secure atomic server-side process. Do not manually approve from this demo.");
let no=document.createElement("button");no.textContent="Reject";
no.onclick=async()=>{await update(ref(db,"walletRequests/"+uid+"/"+id),{status:"rejected",reviewedAt:Date.now()});load()};
d.append(ok,no);fundList.append(d);
}));

let o=(await get(ref(db,"orders"))).val()||{};
orderList.innerHTML="";
Object.entries(o).forEach(([uid,items])=>Object.entries(items||{}).forEach(([id,x])=>{
let d=document.createElement("div");d.className="card";
d.textContent=x.productName+" | "+uid+" | "+x.status+" | "+x.trxId;
let ok=document.createElement("button");ok.textContent="Approve";
ok.onclick=async()=>{await update(ref(db,"orders/"+uid+"/"+id),{status:"approved",reviewedAt:Date.now()});load()};
let no=document.createElement("button");no.textContent="Reject";
no.onclick=async()=>{await update(ref(db,"orders/"+uid+"/"+id),{status:"rejected",reviewedAt:Date.now()});load()};
d.append(ok,no);orderList.append(d);
}));

let refs=(await get(ref(db,"referralCodes"))).val()||{};
refList.innerHTML="";
Object.entries(refs).forEach(([id,x])=>{
let d=document.createElement("div");d.className="card";
d.textContent=id+" | ৳"+x.amount+" | "+x.limit+" uses";
refList.append(d);
});
}

window.createReferral=async()=>{
let code=refText.value.trim().toUpperCase(),amount=Number(refAmount.value),limit=Number(refLimit.value);
if(!code||amount<=0||limit<1||limit>3)return alert("Enter valid code, amount and limit (1–3)");
let exists=await get(ref(db,"referralCodes/"+code));
if(exists.exists())return alert("Code already exists");
await set(ref(db,"referralCodes/"+code),{amount,limit,used:0,active:true,createdAt:Date.now()});
alert("Referral created");load();
};

window.saveSettings=async()=>{
await set(ref(db,"settings/home"),{title:homeTitle.value,subtitle:homeSubtitle.value});
await set(ref(db,"settings/notice"),notice.value);
alert("Settings saved");
};
</script>
</body>
</html>
